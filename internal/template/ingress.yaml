# ===================================================================
# BƯỚC 1: CÀI ĐẶT NGINX INGRESS CONTROLLER
# ===================================================================
# Chạy command sau để cài đặt:
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/cloud/deploy.yaml

# Kiểm tra Ingress Controller đã chạy chưa:
# kubectl get pods -n ingress-nginx

# ===================================================================
# BƯỚC 2: TẠO INGRESS RESOURCE VỚI PATH-BASED ROUTING + REWRITE
# ===================================================================

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: default  # Thay đổi nếu services của bạn ở namespace khác
  annotations:
    # Sử dụng nginx ingress controller
    kubernetes.io/ingress.class: "nginx"
    
    # QUAN TRỌNG: Rewrite path để remove prefix
    # Ví dụ: /api1/users -> /users trước khi forward đến service
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    
    # Regex để capture phần path sau prefix
    nginx.ingress.kubernetes.io/use-regex: "true"
    
    # Tự động redirect HTTP sang HTTPS (bật sau khi có SSL)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Tăng timeout cho các request dài
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    
    # Tăng kích thước body cho upload file
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    
    # CORS settings (nếu cần)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  rules:
  - host: yourdomain.com
    http:
      paths:
      # ===================================================================
      # API 1 - Request sẽ được rewrite
      # Ví dụ: yourdomain.com/api1/users -> api1-service:80/users
      # ===================================================================
      - path: /api1(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: api1-service
            port:
              number: 80
      
      # ===================================================================
      # CMS 1
      # Ví dụ: yourdomain.com/cms1/dashboard -> cms1-service:80/dashboard
      # ===================================================================
      - path: /cms1(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: cms1-service
            port:
              number: 80
      
      # ===================================================================
      # API 2
      # Ví dụ: yourdomain.com/api2/products -> api2-service:80/products
      # ===================================================================
      - path: /api2(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: api2-service
            port:
              number: 80
      
      # ===================================================================
      # CMS 2
      # Ví dụ: yourdomain.com/cms2/admin -> cms2-service:80/admin
      # ===================================================================
      - path: /cms2(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: cms2-service
            port:
              number: 80
      
      # ===================================================================
      # Main App - Root path (Landing page hoặc app chính)
      # Ví dụ: yourdomain.com/ -> main-app-service:80/
      # ===================================================================
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: main-app-service
            port:
              number: 80

---
# ===================================================================
# ALTERNATIVE: INGRESS RIÊNG CHO TỪNG SERVICE (Dễ quản lý hơn)
# Nếu bạn muốn tách biệt config cho từng service
# ===================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api1-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: yourdomain.com
    http:
      paths:
      - path: /api1(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: api1-service
            port:
              number: 80

